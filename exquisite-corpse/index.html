<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exquisite Corpse | Amandine Mangon</title>

  <!-- uses the same p5 files as the homepage collage -->
  <script src="../collage/p5.min.js"></script>
  <script src="../collage/p5.sound.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
    }
       canvas {
      display: block;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* shown while the pictures load (p5 removes it when they're ready) */
    #p5_loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(12px, calc(0.5vw + 6.5px), 17px);
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: #000;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="p5_loading">Loading</div>
  <script src="sketch.js"></script>
</body>
</html>
