<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound &amp; Video | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --gap: clamp(28px, 4vw, 72px);       /* space between the photo and the longer caption */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .tabs a:hover,
    .current,
    .site-name:hover {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }
    .text-link {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }
    .text-link:hover { opacity: 0.6; }

    /* ---------- top left: SOUND & VIDEO + its pieces ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      right: 30vw;
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 1.9em; }

    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- the area under the top bar: scrolls on its own ---------- */
    .stage {
      position: fixed;
      inset: calc(var(--pad-y) + 4.5em) 0 0 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }

    /* first screen: the video, centered, caption underneath (same width) */
    .first {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad-x) calc(var(--pad-y) + 1.5em);
    }
    .film video {
      display: block;
      width: 100%;
      background: #000;
    }
    .caption { margin-top: 1.1em; line-height: 1.35; }
    .caption .desc { margin-top: 1.3em; }
    .caption p + p.more-line { margin-top: 1.3em; }

    /* after scrolling: photo on the left, longer caption on the right */
    .about {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad-x) calc(var(--pad-y) + 1.5em);
    }
    .about-row { display: flex; align-items: flex-start; gap: calc(var(--gap) * 0.9); }
    .about-row img { display: block; flex: none; }
    .about-row .placeholder {
      flex: none;
      width: 32vw;
      aspect-ratio: 4 / 5;
      background: #eee;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .about-row.stacked { flex-direction: column; padding: 3em 0; }
    .about-text { flex: none; line-height: 1.3; }
    .about-text p + p { margin-top: 1.3em; }

    /* ---------- phones ---------- */
    @media (max-width: 760px) {
      .section-nav { right: var(--pad-x); }
      .stage { position: static; overflow: visible; padding-top: calc(var(--pad-y) + 5em); }
      .first { height: auto; padding-top: 1em; padding-bottom: 3em; }
      .film { width: 100% !important; }
      .about { min-height: 0; padding-bottom: 3em; }
      .about-row { flex-direction: column; }
      .about-row img, .about-row .placeholder { width: 100% !important; height: auto !important; }
      .about-text { width: auto !important; }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><span>Sound &amp; Video</span></div>
    <div class="nav-row tabs" id="tabs"></div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage" id="stage"></main>

  <script>
    /* ==============================================================
       PIECES — one tab each, in this order.
       video    = the video file
       name / classLine / desc = the caption under the video
       more     = extra lines under the caption (can include links)
       aboutPhoto / about = what you see when you scroll down:
                  a photo on the left and a longer caption on the right
                  (leave them out for no second part)
       ============================================================== */
    var PIECES = [
      {
        id: "there-you-are",
        name: "There You Are",
        video: "video/ThereYouAre.mp4",
        classLine: "Still and Moving Images; NYU IDM, Fall 2026.",
        desc: "An experimental film made of still images, text, and no audio.",

        // PHOTO: in the "video" folder, with exactly this name
        aboutPhoto: "video/singleimage.JPG",
        // next to the photo, like The Five Stages of Grief:
        // first the photo's caption, then how the single image became the film
        about: [
          "This image is about feeling unsure of who you are when growing up. The paint suggests a decision, " +
          "but without a hand or paintbrush visible, we can’t tell if the girl is about to make a change or already has. " +
          "The shadows symbolize impermanence and the passage of time, and are a reflection of who she is now, " +
          "and who she might become.",

          "There You Are began as a continuation of this single image: I wanted to see what would happen if one " +
          "photograph grew into a series of images, and the series into a film.",
          "In that shift, the original message changed slightly. The uncertainty of growing up became a game of " +
          "hide-and-seek, with the girl appearing and disappearing from frame to frame. The result feels eerie and " +
          "childish at the same time, like a game you played as a kid that turns strange when you look back on it."
        ]
      },
      {
        id: "melody-nelson",
        name: "Melody Nelson",
        video: "sound/sounddesign.mp4",
        title: "Obsession",                       // the first line of the caption
        classLine: "Audio Foundation Studio; NYU IDM.",
        desc: "Sound design for Serge Gainsbourg’s “Histoire de Melody Nelson”; Reaper.",
        more: [
          'Like <a class="text-link" href="graphic-design.html#iconoclast">Iconoclast</a>, this piece is about ' +
          'Serge Gainsbourg and Jane Birkin, a thread back to my French roots.'
        ]
      }
    ];

    /* ============================================================== */

    (function () {
      var tabs = document.getElementById("tabs");
      var stage = document.getElementById("stage");
      var piece, film, video, caption;

      PIECES.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "#" + p.id;
        a.textContent = p.name;
        a.setAttribute("data-id", p.id);
        tabs.appendChild(a);
      });

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function load() {
        var id = (location.hash || "").slice(1).toLowerCase();
        piece = PIECES.filter(function (p) { return p.id === id; })[0] || PIECES[0];
        Array.prototype.forEach.call(tabs.children, function (a) {
          a.classList.toggle("current", a.getAttribute("data-id") === piece.id);
        });
        document.title = piece.name + " | Amandine Mangon";

        // (switching tabs removes the old video, which also stops it)
        stage.innerHTML = "";
        stage.scrollTop = 0;
        window.scrollTo(0, 0);

        var first = el("section", "first");
        film = el("figure", "film");
        video = el("video");
        video.src = piece.video;
        video.controls = true;
        video.setAttribute("playsinline", "");
        video.preload = "metadata";
        video.addEventListener("loadedmetadata", size);
        caption = el("figcaption", "caption");
        caption.appendChild(el("p", null, piece.title || piece.name));
        caption.appendChild(el("p", null, piece.classLine || ""));
        caption.appendChild(el("p", "desc", piece.desc || ""));
        (piece.more || []).forEach(function (html) {
          var p = el("p", "more-line");
          p.innerHTML = html;
          caption.appendChild(p);
        });
        film.appendChild(video);
        film.appendChild(caption);
        first.appendChild(film);
        stage.appendChild(first);

        aboutRow = null;
        if (piece.about) {
          var about = el("section", "about");
          aboutRow = el("div", "about-row");
          var img = el("img");
          img.alt = piece.name;
          img.addEventListener("load", sizeAbout);
          img.addEventListener("error", function () {     // photo not added yet → grey box
            img.replaceWith(el("div", "placeholder", "Photo"));
            sizeAbout();
          });
          img.src = piece.aboutPhoto || "";
          var text = el("div", "about-text");
          piece.about.forEach(function (html) {
            var p = el("p");
            p.innerHTML = html;
            text.appendChild(p);
          });
          aboutRow.appendChild(img);
          aboutRow.appendChild(text);
          about.appendChild(aboutRow);
          stage.appendChild(about);
        }
        size();
      }

      /* The video is as big as fits on the first screen (with room for the
         caption), and the caption is exactly as wide as the video. */
      function size() {
        if (!film) return;
        if (window.matchMedia("(max-width: 760px)").matches) { film.style.width = ""; return; }
        var first = stage.querySelector(".first");
        var cs = getComputedStyle(first);
        var W = first.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var ratio = (video.videoWidth && video.videoHeight) ? video.videoWidth / video.videoHeight : 16 / 9;
        film.style.width = Math.min(W * 0.7, 1300) + "px";
        var room = caption.offsetHeight + parseFloat(getComputedStyle(caption).marginTop);
        var H = first.clientHeight - parseFloat(cs.paddingBottom) - room;
        var w = Math.min(W * 0.7, 1300, H * ratio);
        film.style.width = Math.max(w, 200) + "px";
      }

      var aboutRow = null;
      function sizeAbout() {
        if (!aboutRow) return;
        var img = aboutRow.querySelector("img");
        var text = aboutRow.querySelector(".about-text");
        var total = Math.min(window.innerWidth * 0.88, 1500);   // width of photo + text together
        aboutRow.classList.remove("stacked");
        if (window.matchMedia("(max-width: 760px)").matches) return;
        if (!img || !img.naturalWidth) {
          if (img) return;                        // still loading
          text.style.width = Math.min(total * 0.55, 900) + "px";
          return;
        }
        var ratio = img.naturalWidth / img.naturalHeight;
        var gap = parseFloat(getComputedStyle(aboutRow).columnGap) || 0;
        function widthWith(t) {                   // full width of the pair when the text is t wide
          text.style.width = t + "px";
          return t + gap + text.offsetHeight * ratio;
        }
        var a = total * 0.15, b = total, n;       // narrowest the pair can be
        for (n = 0; n < 24; n++) {
          var m1 = a + (b - a) / 3, m2 = b - (b - a) / 3;
          if (widthWith(m1) < widthWith(m2)) b = m2; else a = m1;
        }
        var t = (a + b) / 2;
        var SHARE = 0.52, lo2 = t, hi2 = total;  // first choice: photo about half as wide as the text
        for (n = 0; n < 22; n++) {
          var m = (lo2 + hi2) / 2;
          if (widthWith(m) - gap - m > SHARE * m) lo2 = m; else hi2 = m;
        }
        if (widthWith(hi2) <= total) {
          t = hi2;
        } else if (widthWith(t) <= total) {
          var lo = t, hi = total;
          for (n = 0; n < 22; n++) {
            var mid = (lo + hi) / 2;
            if (widthWith(mid) <= total) lo = mid; else hi = mid;
          }
          t = lo;
        } else if (widthWith(t) > window.innerWidth * 0.94) {
          aboutRow.classList.add("stacked");     // too narrow: photo on top, text under
          text.style.width = Math.min(total, 1000) + "px";
          img.style.width = Math.min(total, 1000) + "px";
          img.style.height = "auto";
          return;
        }
        text.style.width = t + "px";
        var h = text.offsetHeight;
        img.style.height = h + "px";
        img.style.width = h * ratio + "px";
      }
      window.addEventListener("resize", sizeAbout);
      if (document.fonts) document.fonts.ready.then(sizeAbout);

      window.addEventListener("resize", size);
      window.addEventListener("hashchange", load);
      load();
    })();
  </script>
  <script src="menu.js"></script>
</body>
</html>
